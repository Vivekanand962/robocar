<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robot Car Access</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--fg:#e9ecf1;--mute:#8b93a3;--acc:#2f7cf6;--ok:#2fb26a;--bad:#e5484d;--warn:#f0a020}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
h1{margin:0 0 4px;font-size:22px}
p{margin:0 0 18px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
input,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1115;color:var(--fg);font:inherit}
textarea{resize:vertical;min-height:70px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 16px system-ui;cursor:pointer}
button:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.state{text-align:center}
.icon{font-size:44px;margin-bottom:6px}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:8px auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none}
</style></head><body>
<div class="card">
  <div id="form">
    <h1>&#128663; Robot Car</h1>
    <p>This car is private. Ask the owner for permission to drive it. You will get access as soon as they approve.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="40" autocomplete="name">
    <label for="msg">Message to owner (optional)</label>
    <textarea id="msg" maxlength="200"></textarea>
    <button id="go">Request access</button>
    <div class="err" id="err"></div>
  </div>
  <div id="wait" class="state hide">
    <div class="spin"></div>
    <h1>Waiting for approval</h1>
    <p>The owner has been notified. Keep this page open, it opens automatically when you are allowed in.</p>
  </div>
  <div id="no" class="state hide">
    <div class="icon">&#128683;</div>
    <h1 id="noT">Access denied</h1>
    <p id="noP">The owner did not allow access.</p>
    <button id="again">Ask again</button>
    <div class="err" id="err2"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function show(id){['form','wait','no'].forEach(x=>$(x).classList.toggle('hide',x!==id));}
const TEXT={denied:['Access denied','The owner did not allow access.'],
  revoked:['Access removed','The owner has taken back your access.'],
  expired:['Time is up','Your driving time has ended. You can ask for more.']};
async function check(){
  try{
    const j=await (await fetch('/api/me',{cache:'no-store'})).json();
    if(j.state==='approved'){location.reload();return;}
    if(j.state==='pending')show('wait');
    else if(TEXT[j.state]){$('noT').textContent=TEXT[j.state][0];$('noP').textContent=TEXT[j.state][1];show('no');}
    else show('form');
    if(j.name&&!$('name').value)$('name').value=j.name;
  }catch(e){}
}
async function ask(errEl){
  errEl.textContent='';
  const name=$('name').value.trim();
  if(name.length<2){show('form');$('err').textContent='Please enter your name';$('name').focus();return;}
  $('go').disabled=true;
  try{
    const r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,msg:$('msg').value})});
    const j=await r.json();
    if(!r.ok)errEl.textContent=j.error||'Error';else check();
  }catch(e){errEl.textContent='Network error';}
  $('go').disabled=false;
}
$('go').onclick=()=>ask($('err'));
$('again').onclick=()=>{show('form');};
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')ask($('err'));});
check();setInterval(check,2500);
</script></body></html>
